<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Cadastro - DocSenai</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="../css/Cadastro.css">
</head>

<body>

    <main class="cadastro-page">

        <div class="cadastro-content">

            <section class="cadastro-info">


                <div class="logo">
                    <img src="../img/logo.png" alt="Logo DocSenai">
                </div>



                <div class="info-text">

                    <h1 class="cadastro-title">
                        Suas evidências
                        <br>
                        pedagógicas,
                        <br>

                        <span>
                            de forma simples
                            <br>
                            e organizada.
                        </span>
                    </h1>

                    <p class="cadastro-description">
                        Registre atividades, envie
                        <br>
                        fotografias e gere relatórios
                        <br>
                        de forma prática e segura.
                    </p>

                </div>

            </section>


            <section class="cadastro-card">

                <div class="cadastro-card-header">

                    <h2>
                        Cadastre-se
                    </h2>

                    <p>
                        Crie sua conta para continuar
                    </p>

                </div>




                <form id="cadastroForm">




                    <div class="form-group">

                        <label for="nome">
                            Nome
                        </label>

                        <div class="input-wrapper">

                            <span class="input-icon">
                                <i class="fa-solid fa-user"></i>
                            </span>

                            <input type="text" id="nome" name="nome" placeholder="Digite seu nome" autocomplete="name"
                                required>

                        </div>

                    </div>




                    <div class="form-group">

                        <label for="email">
                            E-mail
                        </label>

                        <div class="input-wrapper">

                            <span class="input-icon">
                                <i class="fa-regular fa-envelope"></i>
                            </span>

                            <input type="email" id="email" name="email" placeholder="Digite seu e-mail"
                                autocomplete="email" required>

                        </div>

                    </div>




                    <div class="form-group">

                        <label for="senha">
                            Senha
                        </label>

                        <div class="input-wrapper">

                            <span class="input-icon">
                                <i class="fa-solid fa-key"></i>
                            </span>

                            <input type="password" id="senha" name="senha" placeholder="Digite sua senha"
                                autocomplete="new-password" required>

                            <button type="button" class="password-toggle" id="toggleSenha" aria-label="Mostrar senha">

                                <i class="fa-solid fa-eye"></i>

                            </button>

                        </div>

                    </div>



                    <div class="form-group">

                        <label for="cargo">
                            Cargo
                        </label>

                        <div class="input-wrapper">

                            <span class="input-icon">
                                <i class="fa-solid fa-user-tie"></i>
                            </span>

                            <select id="cargo" name="cargo" required>

                                <option value="" disabled selected>
                                    Selecione seu cargo
                                </option>

                                <option value="Professor">
                                    Professor
                                </option>

                                <option value="Supervisao">
                                    Supervisão
                                </option>

                            </select>

                            <span class="select-arrow">
                                <i class="fa-solid fa-chevron-down"></i>
                            </span>

                        </div>

                    </div>




                    <button type="submit" class="btn-primary">

                        Cadastrar-se

                    </button>


                </form>




                <div class="login-link">

                    Já possui uma conta?

                    <a href="login.html">
                        Entrar
                    </a>

                </div>




                <div class="support">

                    Precisa de ajuda?

                    <a href="#">
                        Fale com o suporte
                    </a>

                </div>

            </section>

        </div>

    </main>



    <script src="../js/Cadastro.js"></script>
</body>

</html>
