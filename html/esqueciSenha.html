<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Esqueci minha senha - DocSenai</title>

   
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    >

  
    <link rel="stylesheet" href="../css/esquecisenha.css">
</head>

<body>

    <main class="recuperacao-page">

        <div class="recuperacao-content">

           
            <section class="recuperacao-info">

                <div class="logo">
                    <img
                        src="../img/logo.png"
                        alt="Logo DocSenai"
                    >
                </div>

                <div class="info-text">

                    <h1 class="recuperacao-title">

                        Recupere seu
                        <br>
                        acesso de forma
                        <br>

                        <span>
                            simples e segura.
                        </span>

                    </h1>

                    <p class="recuperacao-description">

                        Informe seu e-mail cadastrado
                        <br>
                        para receber as instruções
                        <br>
                        de recuperação da sua senha.

                    </p>

                </div>

            </section>


         
            <section class="recuperacao-card">

                <div class="recuperacao-card-header">

                    <div class="recovery-icon">

                        <i class="fa-solid fa-lock"></i>

                    </div>

                    <h2>
                        Esqueci minha senha
                    </h2>

                    <p>
                        Recupere o acesso à sua conta
                    </p>

                </div>


                <form id="recuperacaoForm">

                   

                    <div class="form-group">

                        <label for="email">
                            E-mail
                        </label>

                        <div class="input-wrapper">

                            <span class="input-icon">
                                <i class="fa-regular fa-envelope"></i>
                            </span>

                            <input
                                type="email"
                                id="email"
                                name="email"
                                placeholder="Digite seu e-mail"
                                autocomplete="email"
                                required
                            >

                        </div>

                    </div>


                 

                    <button
                        type="submit"
                        class="btn-primary"
                    >
                        Enviar instruções
                    </button>


                

                    <div class="login-link">

                        <a href="login.html">
                            <i class="fa-solid fa-arrow-left"></i>
                            Voltar para o login
                        </a>

                    </div>

                </form>


              

                <div class="support">

                    Precisa de ajuda?

                    <a href="#">
                        Fale com o suporte
                    </a>

                </div>

            </section>

        </div>

    </main>


   

    <script src="../js/esqueciSenha.js"></script>

</body>

</html>
